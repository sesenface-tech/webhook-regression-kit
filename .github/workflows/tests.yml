name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sesenface-tech/delivery-probe
          ref: d17d2077937622535023c37d7d515a2a2a3dfb06
          path: dependencies/delivery-probe
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .:dependencies/delivery-probe
